[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Celo supports Cancun (G$ itself uses post-Cancun opcodes; ReentrancyGuardTransient needs EIP-1153).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Upgrade-safety validation (@openzeppelin/upgrades-core) reads these.
build_info = true
extra_output = ["storageLayout"]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
